<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Demo Report</title>
  <style>
    :root {
      color-scheme: dark;
      --color-bn-deep: #004754;
      --color-bn-light: #e1fcff;
      --color-bn-medium: #037f96;
      --color-bn-bright: #0db7d6;
      --color-bn-ink: #14272b;
      --color-bn-paper: #f6fbfa;
      --color-bn-signal: #f2c94c;
      /* Real Lora/DM Sans would need embedded base64 @font-face blocks for pixel-exact brand fonts offline. */
      --font-heading: Georgia, "Times New Roman", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --error: #b42318;
      --shadow: 0 24px 70px rgba(0, 22, 27, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(13, 183, 214, 0.18), transparent 34rem),
        linear-gradient(145deg, var(--color-bn-deep) 0%, #062d35 45%, #051316 100%);
      color: var(--color-bn-paper);
      font-family: var(--font-body);
      line-height: 1.55;
    }

    .gate-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .gate-card {
      width: min(100%, 28rem);
      overflow: hidden;
      background: var(--color-bn-paper);
      border: 1px solid rgba(13, 183, 214, 0.55);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .brand-strip {
      display: grid;
      place-items: center;
      background: var(--color-bn-deep);
      border-bottom: 3px solid var(--color-bn-bright);
      padding: 1.15rem 1.5rem;
    }

    .brand-logo {
      display: block;
      width: min(100%, 140px);
      height: auto;
    }

    .gate-content {
      padding: 2rem;
    }

    h1 {
      margin: 0 0 1.5rem;
      color: var(--color-bn-deep);
      font-family: var(--font-heading);
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    form {
      display: grid;
      gap: 0.85rem;
    }

    label {
      display: grid;
      gap: 0.45rem;
      color: rgba(20, 39, 43, 0.76);
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      border: 1px solid rgba(0, 71, 84, 0.24);
      border-radius: 6px;
      background: #ffffff;
      color: var(--color-bn-ink);
      font: inherit;
      padding: 0.8rem 0.85rem;
      outline: none;
    }

    input:focus {
      border-color: var(--color-bn-bright);
      box-shadow: 0 0 0 3px rgba(13, 183, 214, 0.18);
    }

    button {
      border: 0;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--color-bn-medium), var(--color-bn-bright));
      color: #ffffff;
      cursor: pointer;
      font: 700 1rem/1 var(--font-body);
      padding: 0.9rem 1rem;
    }

    button:hover {
      background: linear-gradient(135deg, var(--color-bn-deep), var(--color-bn-medium));
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .error {
      min-height: 1.5rem;
      color: var(--error);
      font-size: 0.95rem;
    }

    .report {
      display: none;
      width: min(100% - 2rem, 960px);
      margin: 0 auto;
      padding: 3rem 0 5rem;
      color: var(--color-bn-ink);
    }

    .report.active {
      display: block;
    }

    .report-shell {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid rgba(225, 252, 255, 0.52);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .report-top-rule {
      height: 5px;
      background: linear-gradient(90deg, var(--color-bn-bright), var(--color-bn-signal), var(--color-bn-medium));
    }

    .report-header {
      display: grid;
      gap: 1.35rem;
      padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1.25rem, 5vw, 3rem) 1.5rem;
      border-bottom: 1px solid rgba(0, 71, 84, 0.12);
      background:
        linear-gradient(180deg, rgba(225, 252, 255, 0.6), rgba(255, 255, 255, 0) 72%),
        #ffffff;
    }

    .report-brand {
      display: inline-grid;
      place-items: center;
      justify-self: start;
      width: 132px;
      min-height: 38px;
      padding: 0.55rem 0.7rem;
      background: var(--color-bn-deep);
      border-radius: 6px;
    }

    .report-brand .brand-logo {
      width: 100%;
    }

    .report-title-block {
      display: grid;
      gap: 0.45rem;
      max-width: 46rem;
    }

    .report-title {
      margin: 0;
      color: var(--color-bn-deep);
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .report-meta {
      margin: 0;
      color: rgba(20, 39, 43, 0.62);
      font-size: 0.96rem;
      font-weight: 650;
    }

    .report-body {
      padding: clamp(1.5rem, 5vw, 3rem);
      background: var(--color-bn-paper);
    }

    .report-body > * {
      max-width: 44rem;
    }

    .report-body > :first-child {
      margin-top: 0;
    }

    .report-body > :last-child {
      margin-bottom: 0;
    }

    .report :where(h1, h2, h3) {
      color: var(--color-bn-deep);
      font-family: var(--font-heading);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .report h1 {
      margin: 0 0 1.35rem;
      font-size: clamp(1.75rem, 4vw, 2.45rem);
    }

    .report h2 {
      position: relative;
      margin: 2.6rem 0 1rem;
      padding-bottom: 0.7rem;
      font-size: clamp(1.45rem, 3vw, 2rem);
      border-bottom: 1px solid rgba(0, 71, 84, 0.16);
    }

    .report h2::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 4.5rem;
      height: 3px;
      background: var(--color-bn-bright);
      border-radius: 999px;
    }

    .report h3 {
      margin: 2rem 0 0.75rem;
      font-size: 1.25rem;
    }

    .report p {
      margin: 0 0 1.15rem;
      color: rgba(20, 39, 43, 0.86);
      font-size: 1.02rem;
      line-height: 1.72;
    }

    .report h2:first-child + p {
      max-width: 46rem;
      margin-bottom: 1.7rem;
      padding: 1rem 1.15rem;
      border-left: 4px solid var(--color-bn-bright);
      background: rgba(225, 252, 255, 0.62);
      color: var(--color-bn-ink);
      font-size: 1.08rem;
      line-height: 1.68;
    }

    .report a {
      color: var(--color-bn-medium);
      font-weight: 650;
      text-decoration-color: rgba(13, 183, 214, 0.42);
      text-underline-offset: 0.16em;
    }

    .report code {
      background: rgba(0, 71, 84, 0.08);
      border-radius: 4px;
      padding: 0.12rem 0.3rem;
    }

    .report ul,
    .report ol {
      display: grid;
      gap: 0.65rem;
      margin: 0 0 1.4rem;
      padding-left: 1.35rem;
      color: rgba(20, 39, 43, 0.86);
      line-height: 1.62;
    }

    .report li::marker {
      color: var(--color-bn-medium);
      font-weight: 800;
    }

    .report ul li::marker {
      content: "\25A0  ";
      font-size: 0.72em;
    }

    .report table {
      display: block;
      max-width: 100%;
      margin: 1.25rem 0 2rem;
      overflow-x: auto;
      border: 1px solid rgba(0, 71, 84, 0.12);
      border-radius: 8px;
      border-spacing: 0;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(0, 71, 84, 0.08);
    }

    .report tbody {
      display: table;
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
    }

    .report th,
    .report td {
      padding: 0.82rem 1rem;
      border: 0;
      border-bottom: 1px solid rgba(0, 71, 84, 0.1);
      color: inherit;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    .report th {
      background: var(--color-bn-light);
      color: var(--color-bn-deep);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .report tr:nth-child(odd):not(:first-child) td {
      background: rgba(246, 251, 250, 0.78);
    }

    .report tr:last-child td {
      border-bottom: 0;
    }

    .report td:nth-child(n+2),
    .report th:nth-child(n+2) {
      text-align: right;
    }

    .report p[style*="font-size:0.85rem"],
    .report p[style*="font-size: 0.85rem"],
    .report p:last-child:has(em) {
      max-width: none;
      margin-top: 2.5rem !important;
      padding-top: 1rem;
      border-top: 1px solid rgba(0, 71, 84, 0.16);
      color: rgba(20, 39, 43, 0.58) !important;
      font-size: 0.86rem !important;
      line-height: 1.55;
    }

    @media (max-width: 640px) {
      .report {
        width: min(100% - 1rem, 960px);
        padding: 0.75rem 0 2rem;
      }

      .report-header,
      .report-body {
        padding-inline: 1.1rem;
      }

      .report-brand {
        width: 118px;
      }

      .report th,
      .report td {
        padding: 0.72rem 0.85rem;
      }
    }

    @media print {
      :root {
        color-scheme: light;
      }

      body {
        background: #ffffff;
        color: #000000;
      }

      .gate-shell {
        display: none;
      }

      .report,
      .report.active {
        display: block;
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .report-shell {
        border: 0;
        box-shadow: none;
      }

      .report-header,
      .report-body {
        padding: 0.5in 0;
        background: #ffffff;
      }

      .report table {
        box-shadow: none;
        break-inside: avoid;
      }
    }
  </style>
</head>

        <div class="gate-content">
          <h1>Demo Report</h1>
          <form id="unlock-form" autocomplete="off">
            <label>
              Password
              <input id="password" type="password" autocomplete="current-password" required autofocus>
            </label>
            <button id="unlock-button" type="submit">Unlock report</button>
            <div class="error" id="error" role="alert" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>
    <article class="report" id="report" aria-live="polite">
      <div class="report-shell">
        <div class="report-top-rule"></div>
        <header class="report-header">
          <div class="report-brand" id="report-brand" aria-hidden="true"></div>
          <div class="report-title-block">
            <p class="report-meta">Confidential Client Report</p>
            <h1 class="report-title">Demo Report</h1>
          </div>
        </header>
        <div class="report-body" id="report-body"></div>
      </div>
    </article>
  </main>

  <script>
    const REPORT_TITLE = "Demo Report";
    const SALT_B64 = "V/FBnYT+oWd4DzoOz1ODqg==";
    const IV_B64 = "yR5UYY7OmyhUWlFs";
    const CIPHERTEXT_B64 = "YpNdtVrHwEi4GOHcf4Cc9Dk1v7xHWcZwX89Ih7sGrpKGX0dlr3Y5MkqwV67ffrBpdEBX8wb5P4xJWpz2M/z2w2HLWtxwGlfenr5IoCv2WrnijATbUvI9beNpk0K6zFJCU5nyLIyxISxSnBI946BcUgctgNAEL8HH86NSsxv4a0yqGySdKhwbJ2JdSvkfOfF4WzY9w3DxCCKnv6Ug";
    const PBKDF2_ITERATIONS = 200000;

    const form = document.getElementById("unlock-form");
    const passwordInput = document.getElementById("password");
    const unlockButton = document.getElementById("unlock-button");
    const error = document.getElementById("error");
    const gate = document.getElementById("gate");
    const report = document.getElementById("report");
    const reportBody = document.getElementById("report-body");
    const reportBrand = document.getElementById("report-brand");
    const gateLogo = document.querySelector(".brand-logo");

    function b64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(password, salt) {
      const encoder = new TextEncoder();
      const passwordKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt,
          iterations: PBKDF2_ITERATIONS,
          hash: "SHA-256"
        },
        passwordKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      unlockButton.disabled = true;

      try {
        const salt = b64ToBytes(SALT_B64);
        const iv = b64ToBytes(IV_B64);
        const ciphertext = b64ToBytes(CIPHERTEXT_B64);
        const key = await deriveKey(passwordInput.value, salt);
        const plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          key,
          ciphertext
        );

        const decoder = new TextDecoder();
        reportBody.innerHTML = decoder.decode(plaintext);
        reportBrand.replaceChildren(gateLogo.cloneNode(true));
        document.title = REPORT_TITLE;
        gate.remove();
        report.classList.add("active");
      } catch {
        reportBody.innerHTML = "";
        error.textContent = "Incorrect password";
        passwordInput.select();
      } finally {
        unlockButton.disabled = false;
      }
    });
  </script>
