<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arlo Client Reports</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #1b1f22;
      --border: #30363b;
      --text: #f3f5f6;
      --muted: #aeb7bd;
      --accent: #66d9c6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111315;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(100% - 2rem, 720px);
      margin: 0 auto;
      padding: 4rem 0;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }

    a {
      display: block;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 1rem;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      border-color: var(--accent);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Arlo Client Reports</h1>
    <p>Password-gated static reports.</p>
    <ul>
      <li><a href="reports/demo/">Demo Report</a></li>
    </ul>
  </main>
</body>
</html>
